[project]
name = "ema-99-backtester"
version = "0.1.0"
description = "EMA-99 backtesting system for MA-based buy/sell strategies"
requires-python = ">=3.12"
dependencies = [
    "backtesting>=0.3.3",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "flask>=3.0",
    "loguru>=0.7",
    "streamlit>=1.36.0",
    "plotly>=5.18.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ema-backtest = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
